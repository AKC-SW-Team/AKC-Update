name: Validate update metadata

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-update-metadata.yml'
      - 'products/**'
      - 'schemas/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate update manifests
        shell: pwsh
        run: ./scripts/validate-manifests.ps1
